<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: a barra de baixo vai até a borda e se afasta do
         indicador de início do iPhone pela area segura (env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="Sonora - plataforma social de musica: registre o que ouviu, avalie, escreva reviews, monte listas e construa sua identidade musical."
    />
    <title>Sonora</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- O CSS fica 1 hora em cache no navegador. Mude o ?v= sempre que alterar o
         app.css, para o HTML novo nunca usar o CSS antigo. -->
    <link rel="stylesheet" href="/css/app.css?v=20261112" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div id="app" class="app" hidden>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="conteudo" tabindex="-1"></main>
      <!--
        Crédito em texto, sem âncora: a especificação proíbe link externo para
        a MusicBrainz na interface (§46, §64). A atribuição continua visível.
      -->
      <footer class="rodape">
        <p>
          Sonora — metadados do catálogo por MusicBrainz e capas por Cover Art Archive.
          A plataforma não reproduz música.
        </p>
      </footer>
      <!-- Navegação do celular, preenchida por shell.js. Some no desktop. -->
      <nav class="nav-inferior" id="nav-inferior" aria-label="Navegação principal"></nav>
    </div>

    <div id="tela-login" class="login-shell" hidden></div>

    <div id="boot" class="boot">
      <div class="boot-mark" aria-hidden="true"></div>
      <p class="boot-texto">carregando o Sonora...</p>
    </div>

    <div id="modais" class="modais"></div>
    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
