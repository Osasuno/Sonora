# render.yaml — publicacao do Sonora no Render (Blueprint).
#
# Banco: Postgres do Supabase, pela string do "Session pooler" (porta 5432).
# Valores secretos nao ficam aqui: DATABASE_URL e ADMIN_BOOTSTRAP_PASSWORD sao
# pedidos pelo Render na criacao do Blueprint, e SESSION_SECRET e' gerado por ele.

services:
  - type: web
    name: sonora
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TITULO
        value: Sonora
      # O Render roda em UTC. Sem isto, datas de escuta aparecem um dia antes no
      # navegador e o "hoje" vira amanha a partir das 21h no Brasil.
      - key: TZ
        value: America/Sao_Paulo
      # Dois proxies na frente do app no Render. Com 1, o rate limit agrupava
      # as pessoas pelo IP do proxy.
      - key: TRUST_PROXY_HOPS
        value: "2"

      # postgresql://postgres.<ref>:<senha>@aws-<n>-<regiao>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Schema proprio, fora do `public` exposto pela Data API do Supabase.
      - key: APP_SCHEMA
        value: sonora
      - key: DATABASE_SSL
        value: require

      # O MusicBrainz exige identificacao (URL ou e-mail) no User-Agent.
      - key: MUSICBRAINZ_CONTACT
        value: https://github.com/Osasuno/Sonora

      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_USER
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
